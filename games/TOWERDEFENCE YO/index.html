button:active {

canvas {

/* =========================================================

========================================================= */

let audioCtx = null;

function getAudioCtx() {

    if(!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if(audioCtx.state === "suspended") {
        audioCtx.resume();
    }

    return audioCtx;

}

function beep(freq, duration, type="square", volume=0.08, startDelay=0) {

    if(!soundEnabled)
        return;

    const ctxA = getAudioCtx();

    const osc = ctxA.createOscillator();
    const gain = ctxA.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    const now = ctxA.currentTime + startDelay;

    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+duration);

    osc.connect(gain);
    gain.connect(ctxA.destination);

    osc.start(now);
    osc.stop(now+duration);

}

/* =========================================================
   BACKGROUND MUSIC
   (procedural chiptune loop, no external files)

   An original dark/dramatic minor-key arrangement inspired
   by gothic-rock power-ballad energy: brooding harmonic-minor
   tension chord, driving power-chord bass, and a dynamic
   build from a hushed intro into a full-drum "chorus" swell.
   Notes and drum pattern below are all original, not a
   transcription of any existing song.
========================================================= */

let musicEnabled = true;
let musicPlaying = false;
let musicNextNoteTime = 0;
let musicStepIndex = 0;
let musicTimerId = null;

const MUSIC_TEMPO = 108;
const MUSIC_STEP_DURATION = 60 / MUSIC_TEMPO / 2;

const NOTE_SEMITONES = {C:-9, D:-7, E:-5, F:-4, G:-2, A:0, B:2};

function noteFreq(name) {

    if(!name)
        return null;

    const sharp = name[1] === "#";

    const letter = name[0];
    const octave = parseInt(name.slice(sharp ? 2 : 1), 10);

    const semitone =
        NOTE_SEMITONES[letter] + (sharp ? 1 : 0) + (octave-4)*12;

    return 440 * Math.pow(2, semitone/12);

}

/*
 * E minor, i - VII - VI - V, with a raised 7th (D#) on the V
 * chord for that dramatic harmonic-minor pull back to i.
 * Structure: hushed intro (A) -> building verse (A2) ->
 * explosive chorus (B) -> settling back down (A) before loop.
 */

const musicBassA = [
    "E2","E3","E2","E3",
    "D2","D3","D2","D3",
    "C2","C3","C2","C3",
    "B2","B3","B2","B3"
];

const musicMelodyA = [
    "E4", null,"G4", null,
    "F#4",null,"A4", null,
    "G4", null,"E4", null,
    "F#4",null,"D#4",null
];

const musicBassA2 = musicBassA;

const musicMelodyA2 = [
    "E4","G4","B4","G4",
    "F#4","A4","D5","A4",
    "E4","G4","C5","G4",
    "F#4","D#5","F#5","D#5"
];

const musicBassB = musicBassA;

const musicMelodyB = [
    "E5","B4","G5","B4",
    "D5","A4","F#5","A4",
    "C5","G4","E5","G4",
    "D#5","F#5","B5","F#5"
];

const musicBass = [
    ...musicBassA,
    ...musicBassA2,
    ...musicBassB,
    ...musicBassA
];

const musicMelody = [
    ...musicMelodyA,
    ...musicMelodyA2,
    ...musicMelodyB,
    ...musicMelodyA
];

/*
 * Per-section (16-step) dynamics: quiet intro, building
 * verse, full explosive chorus, settling back down.
 */

const MUSIC_SECTION_VOLUME = [0.55, 0.8, 1.0, 0.75];
const MUSIC_SECTION_DRUMS = [0, 0.55, 1.0, 0.6];

const MUSIC_KICK_STEPS = [0,3,4,8,11,12];
const MUSIC_SNARE_STEPS = [2,6,10,14];

function playMusicNote(freq, time, duration, type, volume) {

    if(!freq)
        return;

    const ctxA = getAudioCtx();

    const osc = ctxA.createOscillator();
    const gain = ctxA.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.linearRampToValueAtTime(volume, time+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, time+duration);

    osc.connect(gain);
    gain.connect(ctxA.destination);

    osc.start(time);
    osc.stop(time+duration+0.05);

}

function playKick(time, volume) {

    const ctxA = getAudioCtx();

    const osc = ctxA.createOscillator();
    const gain = ctxA.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(45, time+0.15);

    gain.gain.setValueAtTime(0.001, time);
    gain.gain.linearRampToValueAtTime(0.4*volume, time+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, time+0.18);

    osc.connect(gain);
    gain.connect(ctxA.destination);

    osc.start(time);
    osc.stop(time+0.2);

}

function playNoiseHit(time, duration, volume, filterType, filterFreq) {

    const ctxA = getAudioCtx();

    const bufferSize = Math.max(1, Math.floor(ctxA.sampleRate*duration));
    const buffer = ctxA.createBuffer(1, bufferSize, ctxA.sampleRate);
    const data = buffer.getChannelData(0);

    for(let i=0;i<bufferSize;i++) {
        data[i] = Math.random()*2-1;
    }

    const noise = ctxA.createBufferSource();
    noise.buffer = buffer;

    const filter = ctxA.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.value = filterFreq;

    const gain = ctxA.createGain();
    gain.gain.setValueAtTime(volume, time);
    gain.gain.exponentialRampToValueAtTime(0.0001, time+duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctxA.destination);

    noise.start(time);

}

function playHat(time, volume) {
    playNoiseHit(time, 0.045, volume, "highpass", 7000);
}

function playSnare(time, volume) {
    playNoiseHit(time, 0.14, volume, "bandpass", 1800);
}

function scheduleMusic() {

    const ctxA = getAudioCtx();

    while(musicNextNoteTime < ctxA.currentTime + 0.15) {

        const i = musicStepIndex % musicMelody.length;
        const section = Math.floor(i/16);
        const stepInBar = i%16;

        const vol = MUSIC_SECTION_VOLUME[section];
        const drums = MUSIC_SECTION_DRUMS[section];

        playMusicNote(
            noteFreq(musicBass[i]),
            musicNextNoteTime,
            MUSIC_STEP_DURATION*0.9,
            "square",
            0.055*vol
        );

        playMusicNote(
            noteFreq(musicMelody[i]),
            musicNextNoteTime,
            MUSIC_STEP_DURATION*0.85,
            "sawtooth",
            0.032*vol
        );

        if(drums > 0) {

            playHat(musicNextNoteTime, 0.02*drums);

            if(MUSIC_KICK_STEPS.includes(stepInBar)) {
                playKick(musicNextNoteTime, drums);
            }

            if(MUSIC_SNARE_STEPS.includes(stepInBar)) {
                playSnare(musicNextNoteTime, 0.09*drums);
            }

        }

        musicNextNoteTime += MUSIC_STEP_DURATION;
        musicStepIndex++;

    }

}

function startMusic() {

    if(musicPlaying || !musicEnabled)
        return;

    const ctxA = getAudioCtx();

    musicNextNoteTime = ctxA.currentTime + 0.1;
    musicStepIndex = 0;
    musicPlaying = true;

    musicTimerId = setInterval(scheduleMusic, 100);

}

function stopMusic() {

    musicPlaying = false;

    clearInterval(musicTimerId);

}

function toggleMusic() {

    musicEnabled = !musicEnabled;

    const btn = document.getElementById("musicBtn");

    btn.innerText = "MUSIC: " + (musicEnabled ? "ON" : "OFF");
    btn.classList.toggle("off", !musicEnabled);

    if(musicEnabled) {
        startMusic();
    } else {
        stopMusic();
    }

}

/*
 * Browsers require a user gesture before audio can play,
 * so kick the music off on the player's first interaction.
 */

window.addEventListener("pointerdown", function startMusicOnce() {

    if(musicEnabled) {
        startMusic();
    }

    window.removeEventListener("pointerdown", startMusicOnce);

});

function showMessage(text) {

    const el = document.getElementById("message");

    el.innerText = text;
    el.style.display = "block";

    setTimeout(() => {
        el.style.display = "none";
    }, 1800);
}

let waveToastTimer = null;

function showWaveToast(waveNumber, waveName, enemyGroups, hpMultiplier) {

    const box = document.getElementById("waveToast");

    let html = `<h4>${
        waveName ? waveName.toUpperCase() : "WAVE " + waveNumber
    }</h4>`;

    for(const [type, count] of enemyGroups) {

        const data = enemyTypes[type];
        const hp = Math.round(data.hp * hpMultiplier);
        const label = ENEMY_LABELS[type] || type;

        html += `
            <div class="waveEnemyRow">
                <span class="swatch" style="background:${data.color}"></span>
                <span>${label} &times;${count}</span>
                <span class="stats">HP ${hp} &middot; SPD ${data.speed}</span>
            </div>
        `;

    }

    box.innerHTML = html;
    box.style.display = "block";

    clearTimeout(waveToastTimer);

    waveToastTimer = setTimeout(() => {
        box.style.display = "none";
    }, 5000);

}

function updateUI() {

    document.getElementById("gold").innerText = gold;
    document.getElementById("lives").innerText = lives;

    document.getElementById("wave").innerText =
        isEndless
        ? `${currentWave} / ∞`
        : `${currentWave} / ${waves.length}`;

    document.getElementById("bestWave").innerText = bestWave;

    for(const btn of document.querySelectorAll(".towerButton")) {

        const type = btn.dataset.type;

        btn.classList.toggle(
            "disabled",
            gold < towerTypes[type].cost
        );

        btn.classList.toggle(
            "active",
            selectedBuildTower === type
        );

    }

    if(selectedTower) {
        updateUpgradeUI();
    }

}

function recordBestWave() {

    if(currentWave > bestWave) {

        bestWave = currentWave;

        localStorage.setItem("td_best_wave", String(bestWave));

        document.getElementById("bestWave").innerText = bestWave;

    }

}


/* =========================================================
   PATH COLLISION
========================================================= */

function distanceToSegment(p,a,b) {

    const dx = b.x-a.x;
    const dy = b.y-a.y;

    if(dx === 0 && dy === 0)
        return distance(p,a);

    const t = Math.max(
        0,
        Math.min(
            1,
            ((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy)
        )
    );

    const x = a.x+t*dx;
    const y = a.y+t*dy;

    return Math.hypot(p.x-x,p.y-y);
}

function isOnPath(x,y,r=20) {

    for(let i=0;i<path.length-1;i++) {

        if(
            distanceToSegment(
                {x,y},
                path[i],
                path[i+1]
            ) < PATH_WIDTH/2+r
        ) {
            return true;
        }

    }

    return false;
}


/* =========================================================
   ENEMY
========================================================= */

class Enemy {

    constructor(type, hpMultiplier=1, waveBatch=null) {

        const data = enemyTypes[type];

        this.type = type;

        this.x = path[0].x;
        this.y = path[0].y;

        this.pathIndex = 0;

        this.maxHp = data.hp * hpMultiplier;
        this.hp = this.maxHp;

        this.speed = data.speed;
        this.reward = data.reward;

        this.size = data.size;
        this.color = data.color;

        this.dead = false;

        this.distanceTraveled = 0;

        this.slowTimer = 0;
        this.slowFactor = 1;

        this.waveBatch = waveBatch;

    }

    applySlow(factor, duration) {

        /*
         * Refresh, don't stack multiplicatively
         */

        if(this.slowTimer <= 0 || factor < this.slowFactor) {
            this.slowFactor = factor;
        }

        this.slowTimer = Math.max(this.slowTimer, duration);

    }

    update(dt) {

        if(this.dead) return;

        if(this.slowTimer > 0) {
            this.slowTimer -= dt;
        }

        const effectiveSpeed =
            this.speed * (this.slowTimer > 0 ? this.slowFactor : 1);

        const target = path[this.pathIndex+1];

        if(!target) {

            this.reachEnd();
            return;

        }

        const dx = target.x-this.x;
        const dy = target.y-this.y;

        const dist = Math.hypot(dx,dy);

        if(dist < 2) {

            this.pathIndex++;

        } else {

            const move = Math.min(dist, effectiveSpeed*dt);

            this.x += dx/dist*move;
            this.y += dy/dist*move;

            this.distanceTraveled += move;

        }

    }

    damage(amount) {

        this.hp -= amount;

        spawnDamageText(this.x, this.y-this.size/2, Math.round(amount));

        if(this.hp <= 0) {

            this.dead = true;

            if(this.waveBatch) {
                this.waveBatch.remaining--;
            }

            gold += this.reward;

            createExplosion(
                this.x,
                this.y,
                this.color
            );

            updateUI();

        }

    }

    reachEnd() {

        this.dead = true;

        if(this.waveBatch) {
            this.waveBatch.remaining--;
        }

        lives--;

        updateUI();

        if(lives <= 0) {

            endGame();

        }

    }

    draw() {

        ctx.fillStyle = this.color;

        const s = this.size;

        ctx.fillRect(
            this.x-s/2,
            this.y-s/2,
            s,
            s
        );

        /*
         * Frost tint overlay while slowed
         */

        if(this.slowTimer > 0) {

            ctx.fillStyle = "rgba(138, 217, 255, 0.45)";

            ctx.fillRect(
                this.x-s/2,
                this.y-s/2,
                s,
                s
            );

        }

        /*
         * Pixel eyes
         */

        ctx.fillStyle = "#111";

        ctx.fillRect(
            this.x-s/4,
            this.y-s/5,
            4,
            4
        );

        ctx.fillRect(
            this.x+s/10,
            this.y-s/5,
            4,
            4
        );

        /*
         * HP bar
         */

        const barWidth = s*1.5;

        ctx.fillStyle = "#111";

        ctx.fillRect(
            this.x-barWidth/2,
            this.y-s/2-10,
            barWidth,
            5
        );

        ctx.fillStyle = "#55e65c";

        ctx.fillRect(
            this.x-barWidth/2,
            this.y-s/2-10,
            barWidth*(this.hp/this.maxHp),
            5
        );

    }

}


/* =========================================================
   TOWER
========================================================= */

class Tower {

    constructor(type,x,y) {

        const data = towerTypes[type];

        this.type = type;
        this.x = x;
        this.y = y;

        this.level = 1;

        this.damage = data.damage;
        this.attackSpeed = data.attackSpeed;

        this.range = data.range;
        this.projectileSpeed = data.projectileSpeed;

        this.splashRadius = data.splashRadius || 0;
        this.slowFactor = data.slowFactor || null;
        this.slowDuration = data.slowDuration || 0;

        this.cooldown = 0;

        this.color = data.color;

        this.totalInvested = data.cost;

        this.targetMode = data.defaultTarget || "closest";

        this.angle = 0;

    }

    findTarget() {

        let target = null;
        let bestScore = -Infinity;

        for(const enemy of enemies) {

            if(enemy.dead)
                continue;

            const d = distance(this,enemy);

            if(d > this.range)
                continue;

            let score;

            switch(this.targetMode) {

                case "furthest":
                    score = enemy.distanceTraveled;
                    break;

                case "strongest":
                    score = enemy.hp;
                    break;

                case "weakest":
                    score = -enemy.hp;
                    break;

                default: // closest
                    score = -d;

            }

            if(score > bestScore) {

                bestScore = score;
                target = enemy;

            }

        }

        return target;

    }

    update(dt) {

        if(this.cooldown > 0) {

            this.cooldown -= dt;

        }

        const target = this.findTarget();

        if(target) {

            this.angle = Math.atan2(
                target.y-this.y,
                target.x-this.x
            );

        }

        if(this.cooldown > 0)
            return;

        if(target) {

            projectiles.push(
                new Projectile(
                    this,
                    target
                )
            );

            if(this.type === "cannon") {
                sfx.shootHeavy();
            } else {
                sfx.shoot();
            }

            this.cooldown = this.attackSpeed;

        }

    }

    draw() {

        /*
         * Range when selected
         */

        if(this === selectedTower) {

            ctx.beginPath();

            ctx.arc(
                this.x,
                this.y,
                this.range,
                0,
                Math.PI*2
            );

            ctx.strokeStyle = "#6ee7ff";
            ctx.lineWidth = 2;
            ctx.stroke();

        }

        /*
         * Base
         */

        ctx.fillStyle = "#252c38";

        ctx.fillRect(
            this.x-20,
            this.y-20,
            40,
            40
        );

        /*
         * Tower
         */

        ctx.fillStyle = this.color;

        ctx.fillRect(
            this.x-13,
            this.y-25,
            26,
            30
        );

        /*
         * Barrel (rotates toward current target)
         */

        ctx.save();

        ctx.translate(this.x, this.y-10);
        ctx.rotate(this.angle+Math.PI/2);

        ctx.fillStyle = "#dce3ea";

        ctx.fillRect(
            -4,
            -25,
            8,
            25
        );

        ctx.restore();

        /*
         * Level
         */

        ctx.fillStyle = "#fff";
        ctx.font = "12px monospace";
        ctx.textAlign = "center";

        ctx.fillText(
            "LV"+this.level,
            this.x,
            this.y+45
        );

    }

}


/* =========================================================
   PROJECTILE
========================================================= */

class Projectile {

    constructor(tower,target) {

        this.x = tower.x;
        this.y = tower.y;

        this.target = target;

        this.damage = tower.damage;

        this.speed = tower.projectileSpeed;

        this.splashRadius = tower.splashRadius;
        this.slowFactor = tower.slowFactor;
        this.slowDuration = tower.slowDuration;

        this.dead = false;

        this.color =
            tower.type === "cannon" ? "#ffb347" :
            tower.type === "frost" ? "#bdeeff" :
            tower.type === "sniper" ? "#ff6b6b" :
            "#e8ff72";

    }

    update(dt) {

        if(!this.target || this.target.dead) {

            this.dead = true;
            return;

        }

        const dx = this.target.x-this.x;
        const dy = this.target.y-this.y;

        const dist = Math.hypot(dx,dy);

        if(dist < 10) {

            const hitX = this.target.x;
            const hitY = this.target.y;

            if(this.splashRadius > 0) {

                for(const enemy of enemies) {

                    if(enemy.dead)
                        continue;

                    if(distance({x:hitX,y:hitY}, enemy) <= this.splashRadius) {
                        enemy.damage(this.damage);
                    }

                }

                createExplosion(hitX, hitY, this.color);
                sfx.explosion();

            } else {

                this.target.damage(this.damage);

                if(this.slowFactor) {
                    this.target.applySlow(this.slowFactor, this.slowDuration);
                }

                createHit(hitX, hitY);
                sfx.hit();

            }

            this.dead = true;

            return;

        }

        this.x += dx/dist*this.speed*dt;
        this.y += dy/dist*this.speed*dt;

    }

    draw() {

        ctx.fillStyle = this.color;

        ctx.fillRect(
            this.x-4,
            this.y-4,
            8,
            8
        );

    }

}


/* =========================================================
   PARTICLES
========================================================= */

function createHit(x,y) {

    for(let i=0;i<5;i++) {

        particles.push({

            x,
            y,

            vx:(Math.random()-0.5)*100,
            vy:(Math.random()-0.5)*100,

            life:0.25

        });

    }

}

function createExplosion(x,y,color) {

    for(let i=0;i<15;i++) {

        particles.push({

            x,
            y,

            vx:(Math.random()-0.5)*180,
            vy:(Math.random()-0.5)*180,

            life:0.5,

            color

        });

    }

}

function updateParticles(dt) {

    for(const p of particles) {

        p.x += p.vx*dt;
        p.y += p.vy*dt;

        p.life -= dt;

    }

    particles =
        particles.filter(p => p.life > 0);

}

function drawParticles() {

    for(const p of particles) {

        ctx.fillStyle = p.color || "#fff";

        ctx.fillRect(
            p.x-3,
            p.y-3,
            6,
            6
        );

    }

}


/* =========================================================
   FLOATING DAMAGE NUMBERS
========================================================= */

function spawnDamageText(x,y,amount) {

    damageTexts.push({
        x,
        y,
        text: String(amount),
        life: 0.6,
        vy: -35
    });

}

function updateDamageTexts(dt) {

    for(const t of damageTexts) {

        t.y += t.vy*dt;
        t.life -= dt;

    }

    damageTexts = damageTexts.filter(t => t.life > 0);

}

function drawDamageTexts() {

    ctx.font = "12px monospace";
    ctx.textAlign = "center";

    for(const t of damageTexts) {

        ctx.fillStyle = `rgba(255,255,255,${Math.min(1,t.life*2)})`;
        ctx.fillText(t.text, t.x, t.y);

    }

}


/* =========================================================
   WAVE SYSTEM
========================================================= */

function generateEndlessWave(n) {

    /*
     * n is 1-indexed wave number beyond the base 10 waves
     */

    const types = ["goblin","fast","tank","elite"];
    const enemiesList = [];

    for(const type of types) {

        const count = 6 + Math.floor(n*1.8) + (type === "goblin" ? 6 : 0);
        enemiesList.push([type, count]);

    }

    if(n % 5 === 0) {
        enemiesList.push(["boss", 1 + Math.floor(n/10)]);
    }

    return {
        name: "Endless Wave " + n,
        enemies: enemiesList
    };

}

function startWave() {

    if(gameOver)
        return;

    if(!isEndless && currentWave >= waves.length) {

        showMessage("ALL WAVES COMPLETE!");

        return;

    }

    currentWave++;

    const wave =
        currentWave <= waves.length
        ? waves[currentWave-1]
        : generateEndlessWave(currentWave-waves.length);

    const queue = [];

    for(const group of wave.enemies) {

        const type = group[0];
        const count = group[1];

        for(let i=0;i<count;i++) {

            queue.push(type);

        }

    }

    const hpMultiplier = 1 + (currentWave-1)*0.12;

    activeWaves.push({
        number: currentWave,
        name: wave.name,
        queue,
        spawnTimer: 0,
        hpMultiplier,
        remaining: queue.length
    });

    sfx.waveStart();

    if(currentWave === 10 && !isEndless) {
        showMessage("⚠ THE BOSS HAS ARRIVED!");
    }

    showWaveToast(currentWave, wave.name, wave.enemies, hpMultiplier);

    updateUI();
    updateStartButton();

}


function updateWaves(dt) {

    for(const batch of activeWaves) {

        if(batch.queue.length > 0) {

            batch.spawnTimer -= dt;

            if(batch.spawnTimer <= 0) {

                const type = batch.queue.shift();

                enemies.push(
                    new Enemy(
                        type,
                        batch.hpMultiplier,
                        batch
                    )
                );

                batch.spawnTimer = 0.7;

            }

        }

    }

    const finished =
        activeWaves.filter(
            b => b.queue.length === 0 && b.remaining <= 0
        );

    if(finished.length > 0) {

        activeWaves =
            activeWaves.filter(
                b => !(b.queue.length === 0 && b.remaining <= 0)
            );

        for(const batch of finished) {

            recordBestWave();

            if(batch.number < waves.length || isEndless) {

                gold += 50 + batch.number*10;

                updateUI();

                sfx.waveComplete();

                showMessage(
                    "WAVE COMPLETE! +BONUS GOLD"
                );

            } else {

                sfx.victory();

                showMessage(
                    "YOU DEFEATED THE BOSS!"
                );

                document.getElementById("victory")
                    .style.display = "flex";

            }

        }

        updateStartButton();

        maybeAutoStart();

    }

}


function maybeAutoStart() {

    if(!autoStart)
        return;

    if(gameOver || activeWaves.length > 0)
        return;

    if(!isEndless && currentWave >= waves.length)
        return;

    setTimeout(() => {

        if(autoStart && !gameOver && activeWaves.length === 0) {
            startWave();
        }

    }, 1500);

}


function updateStartButton() {

    document.getElementById("startBtn").innerText =
        activeWaves.length > 0
        ? "START NEXT WAVE"
        : "START WAVE";

}


function toggleAutoStart() {

    autoStart = !autoStart;

    const btn = document.getElementById("autoBtn");

    btn.innerText = "AUTO: " + (autoStart ? "ON" : "OFF");
    btn.classList.toggle("on", autoStart);

    if(autoStart) {
        maybeAutoStart();
    }

}


function continueEndless() {

    isEndless = true;

    document.getElementById("victory")
        .style.display = "none";

    updateUI();

    showMessage("ENDLESS MODE ENABLED");

    maybeAutoStart();

}


/* =========================================================
   TOWER PLACEMENT
========================================================= */

function selectTower(type) {

    if(gold < towerTypes[type].cost) {

        sfx.error();
        showMessage("NOT ENOUGH GOLD");

        return;

    }

    selectedBuildTower =
        selectedBuildTower === type ? null : type;

    selectedTower = null;

    document.getElementById("upgradePanel")
        .style.display = "none";

    if(selectedBuildTower) {

        showMessage(
            "CLICK GRASS TO PLACE " +
            towerTypes[type].name
        );

    }

    updateUI();

}


function placeTower(x,y) {

    if(!selectedBuildTower)
        return;

    const type =
        towerTypes[selectedBuildTower];

    if(gold < type.cost) {

        sfx.error();
        showMessage("NOT ENOUGH GOLD");

        return;

    }

    /*
     * Cannot place on road
     */

    if(isOnPath(x,y,25)) {

        sfx.error();
        showMessage("CAN'T BUILD ON THE ROAD");

        return;

    }

    /*
     * Prevent overlap
     */

    for(const tower of towers) {

        if(distance({x,y},tower) < 50) {

            sfx.error();
            showMessage("TOO CLOSE TO ANOTHER TOWER");

            return;

        }

    }

    gold -= type.cost;

    towers.push(
        new Tower(
            selectedBuildTower,
            x,
            y
        )
    );

    sfx.place();

    selectedBuildTower = null;

    updateUI();

}

function canPlaceAt(x,y) {

    if(isOnPath(x,y,25))
        return false;

    for(const tower of towers) {

        if(distance({x,y},tower) < 50)
            return false;

    }

    return true;

}


/* =========================================================
   TOWER UPGRADES
========================================================= */

function selectExistingTower(tower) {

    selectedTower = tower;

    selectedBuildTower = null;

    const panel =
        document.getElementById("upgradePanel");

    panel.style.display = "block";

    updateUpgradeUI();

}


function updateUpgradeUI() {

    if(!selectedTower)
        return;

    document.getElementById("selectedTowerName")
        .innerText =
        towerTypes[selectedTower.type].name;

    document.getElementById("towerLevel")
        .innerText =
        selectedTower.level;

    document.getElementById("towerDamage")
        .innerText =
        Math.round(selectedTower.damage);

    document.getElementById("towerSpeed")
        .innerText =
        selectedTower.attackSpeed.toFixed(2)+"s";

    document.getElementById("towerRange")
        .innerText =
        Math.round(selectedTower.range);

    document.getElementById("towerTargetMode")
        .innerText =
        TARGET_MODE_LABELS[selectedTower.targetMode];

    const damageCost =
        40 + selectedTower.level*30;

    const speedCost =
        50 + selectedTower.level*35;

    const rangeCost =
        45 + selectedTower.level*28;

    document.getElementById("damageCost")
        .innerText =
        " $" + damageCost;

    document.getElementById("speedCost")
        .innerText =
        " $" + speedCost;

    document.getElementById("rangeCost")
        .innerText =
        " $" + rangeCost;

    document.getElementById("sellValue")
        .innerText =
        " $" + Math.floor(selectedTower.totalInvested*0.6);

    document.getElementById("upgradeDamageBtn")
        .classList.toggle("disabled", gold < damageCost);

    document.getElementById("upgradeSpeedBtn")
        .classList.toggle("disabled", gold < speedCost);

    document.getElementById("upgradeRangeBtn")
        .classList.toggle("disabled", gold < rangeCost);

}


function upgradeDamage() {

    if(!selectedTower)
        return;

    const cost =
        40 + selectedTower.level*30;

    if(gold < cost) {

        sfx.error();
        showMessage("NOT ENOUGH GOLD");

        return;

    }

    gold -= cost;

    selectedTower.damage *= 1.25;
    selectedTower.totalInvested += cost;

    selectedTower.level++;

    sfx.upgrade();

    updateUI();
    updateUpgradeUI();

}


function upgradeSpeed() {

    if(!selectedTower)
        return;

    const cost =
        50 + selectedTower.level*35;

    if(gold < cost) {

        sfx.error();
        showMessage("NOT ENOUGH GOLD");

        return;

    }

    gold -= cost;

    /*
     * Lower cooldown = faster
     */

    selectedTower.attackSpeed *= 0.88;
    selectedTower.totalInvested += cost;

    selectedTower.level++;

    sfx.upgrade();

    updateUI();
    updateUpgradeUI();

}


function upgradeRange() {

    if(!selectedTower)
        return;

    const cost =
        45 + selectedTower.level*28;

    if(gold < cost) {

        sfx.error();
        showMessage("NOT ENOUGH GOLD");

        return;

    }

    gold -= cost;

    selectedTower.range += 20;
    selectedTower.totalInvested += cost;

    selectedTower.level++;

    sfx.upgrade();

    updateUI();
    updateUpgradeUI();

}


function cycleTargetMode() {

    if(!selectedTower)
        return;

    const idx = TARGET_MODES.indexOf(selectedTower.targetMode);

    selectedTower.targetMode =
        TARGET_MODES[(idx+1) % TARGET_MODES.length];

    updateUpgradeUI();

}


function sellTower() {

    if(!selectedTower)
        return;

    const refund = Math.floor(selectedTower.totalInvested*0.6);

    gold += refund;

    towers = towers.filter(t => t !== selectedTower);

    sfx.sell();

    deselectTower();
    updateUI();

}


function deselectTower() {

    selectedTower = null;

    document.getElementById("upgradePanel")
        .style.display = "none";

}


/* =========================================================
   MOUSE INPUT
========================================================= */

canvas.addEventListener("mousemove", e => {

    const rect =
        canvas.getBoundingClientRect();

    const scaleX =
        canvas.width / rect.width;

    const scaleY =
        canvas.height / rect.height;

    mouseX = (e.clientX-rect.left)*scaleX;
    mouseY = (e.clientY-rect.top)*scaleY;

});

canvas.addEventListener("mouseleave", () => {

    mouseX = -1000;
    mouseY = -1000;

});

canvas.addEventListener("contextmenu", e => {

    e.preventDefault();

    if(selectedBuildTower) {

        selectedBuildTower = null;
        updateUI();

    } else if(selectedTower) {

        deselectTower();

    }

});

window.addEventListener("keydown", e => {

    if(gameOver)
        return;

    if(e.key === "Escape") {

        selectedBuildTower = null;
        deselectTower();
        updateUI();

    } else if(e.key.toLowerCase() === "p") {

        togglePause();

    } else if(e.key === "1") {

        selectTower("archer");

    } else if(e.key === "2") {

        selectTower("cannon");

    } else if(e.key === "3") {

        selectTower("frost");

    } else if(e.key === "4") {

        selectTower("sniper");

    }

});

canvas.addEventListener("click", e => {

    if(gameOver)
        return;

    const rect =
        canvas.getBoundingClientRect();

    const scaleX =
        canvas.width / rect.width;

    const scaleY =
        canvas.height / rect.height;

    const x =
        (e.clientX-rect.left)*scaleX;

    const y =
        (e.clientY-rect.top)*scaleY;

    /*
     * Building
     */

    if(selectedBuildTower) {

        placeTower(x,y);

        return;

    }

    /*
     * Selecting tower
     */

    for(const tower of towers) {

        if(
            distance(
                {x,y},
                tower
            ) < 30
        ) {

            selectExistingTower(tower);

            return;

        }

    }

});


/* =========================================================
   DRAW MAP
========================================================= */

function drawMap() {

    /*
     * Background
     */

    ctx.fillStyle = "#18261d";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /*
     * Pixel grass
     */

    ctx.fillStyle = "#1d3023";

    for(let x=0;x<W;x+=16) {

        for(let y=0;y<H;y+=16) {

            if((x+y)%32===0) {

                ctx.fillRect(
                    x,
                    y,
                    4,
                    4
                );

            }

        }

    }

    /*
     * Road
     */

    ctx.lineWidth = PATH_WIDTH;

    ctx.lineCap = "square";

    ctx.strokeStyle = "#675443";

    ctx.beginPath();

    ctx.moveTo(
        path[0].x,
        path[0].y
    );

    for(let i=1;i<path.length;i++) {

        ctx.lineTo(
            path[i].x,
            path[i].y
        );

    }

    ctx.stroke();

    /*
     * Road pixel details
     */

    ctx.lineWidth = 2;

    ctx.strokeStyle = "#806a54";

    ctx.beginPath();

    ctx.moveTo(
        path[0].x,
        path[0].y
    );

    for(let i=1;i<path.length;i++) {

        ctx.lineTo(
            path[i].x,
            path[i].y
        );

    }

    ctx.stroke();

}


/* =========================================================
   DRAW
========================================================= */

function drawGhostTower() {

    if(!selectedBuildTower)
        return;

    if(mouseX < 0 || mouseY < 0)
        return;

    const data = towerTypes[selectedBuildTower];
    const valid = canPlaceAt(mouseX, mouseY);

    ctx.globalAlpha = 0.5;

    ctx.fillStyle = valid ? data.color : "#ff5555";

    ctx.fillRect(
        mouseX-13,
        mouseY-25,
        26,
        30
    );

    ctx.globalAlpha = 1;

    ctx.beginPath();

    ctx.arc(
        mouseX,
        mouseY,
        data.range,
        0,
        Math.PI*2
    );

    ctx.strokeStyle = valid ? "rgba(110,231,255,0.7)" : "rgba(255,85,85,0.7)";
    ctx.lineWidth = 2;
    ctx.stroke();

}

function draw() {

    drawMap();

    /*
     * Towers
     */

    for(const tower of towers)
        tower.draw();

    /*
     * Enemies
     */

    for(const enemy of enemies)
        enemy.draw();

    /*
     * Projectiles
     */

    for(const projectile of projectiles)
        projectile.draw();

    /*
     * Particles
     */

    drawParticles();
    drawDamageTexts();

    /*
     * Build preview
     */

    drawGhostTower();

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt) {

    if(paused || gameOver)
        return;

    updateWaves(dt);

    for(const enemy of enemies)
        enemy.update(dt);

    for(const tower of towers)
        tower.update(dt);

    for(const projectile of projectiles)
        projectile.update(dt);

    updateParticles(dt);
    updateDamageTexts(dt);

    enemies =
        enemies.filter(e => !e.dead);

    projectiles =
        projectiles.filter(p => !p.dead);

}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime = performance.now();

function gameLoop(now) {

    const dt =
        Math.min(
            0.05,
            (now-lastTime)/1000
        ) * gameSpeed;

    lastTime = now;

    update(dt);

    draw();

    requestAnimationFrame(gameLoop);

}

requestAnimationFrame(gameLoop);


/* =========================================================
   PAUSE / SPEED
========================================================= */

function togglePause() {

    paused = !paused;

    document.getElementById("pauseBtn").innerText =
        paused ? "RESUME" : "PAUSE";

    showMessage(
        paused
        ? "PAUSED"
        : "RESUMED"
    );

}

function toggleSpeed() {

    gameSpeed = gameSpeed === 1 ? 2 : 1;

    const btn = document.getElementById("speedBtn");

    btn.innerText = "SPEED: " + gameSpeed + "x";
    btn.classList.toggle("fast", gameSpeed === 2);

}


/* =========================================================
   GAME OVER
========================================================= */

function endGame() {

    gameOver = true;

    recordBestWave();

    sfx.gameOver();

    document.getElementById("gameOver")
        .style.display = "flex";

    document.getElementById("gameOverTitle")
        .innerText = "GAME OVER";

    document.getElementById("gameOverStats")
        .innerText =
        `Reached wave ${currentWave} — Best: ${bestWave}`;

}


/* =========================================================
   INITIALIZE
========================================================= */

updateUI();

showMessage(
    "BUILD TOWERS AND START WAVE 1!"
);

</script>
